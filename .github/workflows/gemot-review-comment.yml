name: Gemot PR Review (on /review command)

# For unknown contributors, a maintainer comments "/review" to trigger
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/review') &&
      (github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    env:
      GEMOT_URL: https://gemot.dev/a2a
      GEMOT_KEY: ${{ secrets.GEMOT_REVIEW_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Get PR metadata
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.issue.number }}
        run: |
          PR=$(gh pr view "$PR_NUM" --json title,baseRefName)
          echo "title=$(echo "$PR" | jq -r '.title')" >> "$GITHUB_OUTPUT"
          echo "base=$(echo "$PR" | jq -r '.baseRefName')" >> "$GITHUB_OUTPUT"

      - name: Get PR diff
        id: diff
        env:
          BASE_REF: ${{ steps.pr.outputs.base }}
        run: |
          git fetch origin "$BASE_REF"
          DIFF=$(git diff "origin/$BASE_REF"...HEAD | head -c 50000)
          echo "$DIFF" > /tmp/pr-diff.txt
          echo "lines=$(echo "$DIFF" | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Run gemot review
        id: review
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_NUM: ${{ github.event.issue.number }}
          DIFF_LINES: ${{ steps.diff.outputs.lines }}
        run: |
          set -euo pipefail

          rpc() {
            local method="$1" params="$2"
            curl -sf "$GEMOT_URL" -X POST \
              -H "Authorization: Bearer $GEMOT_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}"
          }

          result_field() {
            echo "$1" | jq -r ".result.$2 // empty"
          }

          CREATE=$(rpc "gemot/create_deliberation" "$(jq -n \
            --arg topic "PR #${PR_NUM}: ${PR_TITLE}" \
            --arg desc "Review of PR #${PR_NUM} (${DIFF_LINES} diff lines). Triggered by /review command." \
            '{topic: $topic, description: $desc, type: "reasoning", visibility: "private", max_participants: 10}')")
          DELIB_ID=$(result_field "$CREATE" "deliberation_id")

          DIFF_SUMMARY=$(head -c 8000 /tmp/pr-diff.txt)

          rpc "gemot/submit_position" "$(jq -n --arg did "$DELIB_ID" --arg diff "$DIFF_SUMMARY" \
            '{deliberation_id: $did, agent_id: "code-quality-reviewer", content: ("Review for code quality.\n\nDiff:\n" + $diff), conviction: 0.7}')" > /dev/null
          rpc "gemot/submit_position" "$(jq -n --arg did "$DELIB_ID" --arg diff "$DIFF_SUMMARY" \
            '{deliberation_id: $did, agent_id: "security-reviewer", content: ("Review for security.\n\nDiff:\n" + $diff), conviction: 0.8}')" > /dev/null
          rpc "gemot/submit_position" "$(jq -n --arg did "$DELIB_ID" --arg diff "$DIFF_SUMMARY" \
            '{deliberation_id: $did, agent_id: "architecture-reviewer", content: ("Review for architecture.\n\nDiff:\n" + $diff), conviction: 0.6}')" > /dev/null

          POSITIONS=$(rpc "gemot/get_positions" "{\"deliberation_id\":\"$DELIB_ID\"}")
          CQ_POS=$(echo "$POSITIONS" | jq -r '.result[] | select(.agent_id | endswith("code-quality-reviewer")) | .position_id')
          SEC_POS=$(echo "$POSITIONS" | jq -r '.result[] | select(.agent_id | endswith("security-reviewer")) | .position_id')
          ARCH_POS=$(echo "$POSITIONS" | jq -r '.result[] | select(.agent_id | endswith("architecture-reviewer")) | .position_id')
          # code-quality ↔ architecture agree, security is the wild card
          rpc "gemot/vote" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"code-quality-reviewer\",\"position_id\":\"$SEC_POS\",\"value\":0}" > /dev/null 2>&1 || true
          rpc "gemot/vote" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"code-quality-reviewer\",\"position_id\":\"$ARCH_POS\",\"value\":1}" > /dev/null 2>&1 || true
          rpc "gemot/vote" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"security-reviewer\",\"position_id\":\"$CQ_POS\",\"value\":0}" > /dev/null 2>&1 || true
          rpc "gemot/vote" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"security-reviewer\",\"position_id\":\"$ARCH_POS\",\"value\":0}" > /dev/null 2>&1 || true
          rpc "gemot/vote" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"architecture-reviewer\",\"position_id\":\"$CQ_POS\",\"value\":1}" > /dev/null 2>&1 || true
          rpc "gemot/vote" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"architecture-reviewer\",\"position_id\":\"$SEC_POS\",\"value\":0}" > /dev/null 2>&1 || true

          rpc "gemot/analyze" "{\"deliberation_id\":\"$DELIB_ID\"}" > /dev/null
          for i in $(seq 1 60); do
            sleep 5
            STATUS=$(rpc "gemot/get_deliberation" "{\"deliberation_id\":\"$DELIB_ID\"}")
            CURRENT=$(result_field "$STATUS" "status")
            if [ "$CURRENT" != "analyzing" ]; then break; fi
          done

          JOIN=$(rpc "gemot/generate_join_code" "{\"deliberation_id\":\"$DELIB_ID\",\"role\":\"contributor\",\"ttl_hours\":72}")
          JOIN_CODE=$(result_field "$JOIN" "code")

          CONTEXT=$(rpc "gemot/get_context" "{\"deliberation_id\":\"$DELIB_ID\",\"agent_id\":\"code-quality-reviewer\"}")
          CRUX_COUNT=$(echo "$CONTEXT" | jq '.result.relevant_cruxes // [] | length')
          CRUX_LIST=""
          if [ "$CRUX_COUNT" -gt 0 ]; then
            CRUX_LIST=$(echo "$CONTEXT" | jq -r '.result.relevant_cruxes[] | "- **\(.crux_claim // .claim)** (\(.controversy_score // 0 | . * 100 | floor)% controversial)"' 2>/dev/null || echo "- (see deliberation)")
          fi

          cat > /tmp/pr-comment.md << COMMENT_EOF
          ## Gemot PR Review

          **3 agents reviewed this PR** and found **${CRUX_COUNT} crux(es)**.

          ### Cruxes
          ${CRUX_LIST:-No cruxes detected — reviewers largely agree.}

          ### Join the deliberation

          Your agent can argue back. Join code: \`${JOIN_CODE}\`

          **Already have gemot configured?** Tell your agent:
          > Join the gemot deliberation with code ${JOIN_CODE} and argue back.

          **First time?** Visit https://gemot.dev/join/${JOIN_CODE}

          <!-- gemot:join_code=${JOIN_CODE} deliberation_id=${DELIB_ID} -->
          COMMENT_EOF

      - name: Post PR comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body.trim()
            });
