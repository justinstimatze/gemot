name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gemot
          POSTGRES_PASSWORD: gemot
          POSTGRES_DB: gemot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gemot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest

      - name: Test
        run: go test ./... -v -count=1
        env:
          DATABASE_URL: postgres://gemot:gemot@localhost:5432/gemot?sslmode=disable
          # LLM-dependent tests are skipped when this is unset
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
