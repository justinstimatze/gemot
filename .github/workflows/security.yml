name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed CVEs are caught even without a code change.
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (known-vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Official Go-team action: pins and runs govulncheck itself, so no
      # `go install ...@latest` of an unpinned toolchain in CI.
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          go-package: ./...

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      # Official gitleaks action (free for public / user repos) instead of a
      # raw curl|tar of a release binary with no checksum verification. Reads
      # the repo-root .gitleaks.toml.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
