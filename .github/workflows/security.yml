name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so newly-disclosed CVEs are caught even without a code change.
    - cron: '17 9 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (known-vulnerability scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Official Go-team action: pins and runs govulncheck itself, so no
      # `go install ...@latest` of an unpinned toolchain in CI.
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26'
          go-package: ./...

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0
      # Official gitleaks action (free for public / user repos) instead of a
      # raw curl|tar of a release binary with no checksum verification. Reads
      # the repo-root .gitleaks.toml.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    name: semgrep (static analysis — golang / security-audit / secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Version-pinned (not the moving registry image / not @latest) for
      # supply-chain hygiene, matching the pinned actions above. This is the
      # exact version validated locally against the current tree. Bump
      # deliberately.
      - name: Install semgrep
        run: pip install semgrep==1.163.0
      # Scans production code (internal/, root) against the same three rulesets
      # chit runs. Experiment tooling under scripts/ is excluded via
      # .semgrepignore (math/rand there is game/simulation randomness, and the
      # local experiment runners are not a network-facing surface). The handful
      # of production false positives are annotated inline with `// nosemgrep`
      # plus a justification, so --error stays meaningful: a NEW finding fails CI.
      - name: Run semgrep
        run: semgrep scan --config p/golang --config p/security-audit --config p/secrets --error --metrics off
