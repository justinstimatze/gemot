version: "2"

run:
  timeout: 5m
  tests: false

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - dupl
  settings:
    dupl:
      threshold: 150
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprint
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write
  exclusions:
    paths:
      - testdata
      - scripts

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - testdata
      - scripts
