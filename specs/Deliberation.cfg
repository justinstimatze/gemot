\* Deliberation.cfg — minimal-bounds TLC configuration, safety + liveness
\* in a single run. No symmetry (unsound with liveness per TLC).
\*
\* Bounds were chosen empirically to keep TLC tractable. Even modest
\* increases (MaxPID=2, MaxCID=2) drive the reachable-state count above
\* what 8 workers / 2 GB heap can enumerate in a reasonable window.
\* The generalization argument in README.md §"Symmetric reduction and
\* the n-agent generalization argument" covers lifting to arbitrary n.
\*
\* n=4, Honest=3, Byzantine=1.  f < n/3 holds (1 < 4/3).
\*   MaxRounds = 1  — all rounds collapse to a single Open/Analyze cycle;
\*                    round-transition guards are still exercised by the
\*                    AnalysisAdvance-disabled check.
\*   MaxPID    = 1  — one position, one voting target; still covers the
\*                    full CastVote action space and NoDoubleVote.
\*   MaxCID    = 1  — one commitment, covers the full lifecycle.
\*   VoteValues= {0,1}
SPECIFICATION Spec

CONSTANTS
    Agents      = {a1, a2, a3, a4}
    Byzantine   = {a1}
    MaxRounds   = 1
    MaxPID      = 1
    MaxCID      = 1
    VoteValues  = {0, 1}

INVARIANTS
    TypeOK
    NoDoubleVote
    HonestNoEquivocation
    ByzantineBound

PROPERTIES
    RoundMonotonic
    ClosedAbsorbing
    PositionsMonotonic
    VotesMonotonic
    CommitmentFulfilledStable
    CommitmentBrokenStable
    CommitmentOwnerStable
    Termination
