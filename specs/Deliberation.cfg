\* Deliberation.cfg — minimal-bounds TLC configuration, safety + liveness
\* in a single run. No symmetry (unsound with liveness per TLC).
\*
\* Bounds were chosen empirically to keep TLC tractable. Even modest
\* increases (MaxPID=2, MaxCID=2) drive the reachable-state count above
\* what 8 workers / 2 GB heap can enumerate in a reasonable window.
\* See README.md §"Model bounds and the n-agent generalization argument"
\* for coverage limitations of this minimal cfg and the lifting argument
\* for arbitrary n.
\*
\* n=4, Honest=3, Byzantine=1.  f < n/3 holds (1 < 4/3).
\*   MaxRounds = 1  — RoundMonotonic and AnalysisAdvance are checked
\*                    vacuously here (no transitions possible); meaningful
\*                    round-transition coverage needs MaxRounds >= 2.
\*   MaxPID    = 1  — one total position; still covers CastVote and
\*                    NoDoubleVote, but the Byzantine-equivocation branch
\*                    (cap=2 per round) is unreachable at this bound.
\*   MaxCID    = 1  — one commitment; covers the full pending →
\*                    {fulfilled, broken} lifecycle.
\*   VoteValues= {0,1}
SPECIFICATION Spec

CONSTANTS
    Agents      = {a1, a2, a3, a4}
    Byzantine   = {a1}
    MaxRounds   = 1
    MaxPID      = 1
    MaxCID      = 1
    VoteValues  = {0, 1}

INVARIANTS
    TypeOK
    NoDoubleVote
    HonestNoEquivocation
    ByzantineBound

PROPERTIES
    RoundMonotonic
    ClosedAbsorbing
    PositionsMonotonic
    VotesMonotonic
    CommitmentFulfilledStable
    CommitmentBrokenStable
    CommitmentOwnerStable
    Termination
