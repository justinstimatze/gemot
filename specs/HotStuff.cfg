\* TLC model configuration for HotStuff.tla — minimal bounds exercising
\* both happy-path commit and view-change safety.
\*
\* N=4 replicas, f=1 Byzantine is the minimum non-trivial HotStuff
\* configuration (f<N/3, so N=4 ⇒ f≤1). MaxView=2 with MaxBlocks=3 lets
\* TLC explore: (a) happy-path propose→vote→QC→commit and (b) timeout
\* in view 1 → NewView collection → ViewChange(2) → propose in view 2.
\* Bounded tight for sub-5-second PR-check feedback.

SPECIFICATION Spec

CONSTANTS
    Replicas = {r0, r1, r2, r3}
    Byzantine = {r3}
    MaxView = 2
    MaxHeight = 2
    MaxBlocks = 3

INVARIANTS
    TypeInvariant
    NoDoubleVoteInView
    AgreementAtHeight
    CommittedChainConsistent
    QCRequiresQuorum
    CommitRequiresQC
    ByzantineBound
    NewViewQCIsReal

PROPERTIES
    ViewMonotonic
    CommittedMonotonic
    QCsMonotonic
    VotesMonotonic
    BlocksMonotonic
    NewViewsMonotonic

CHECK_DEADLOCK FALSE
