\* TLC model configuration for HotStuff.tla — session 1 minimal bounds.
\*
\* N=4 replicas, f=1 Byzantine is the minimum non-trivial HotStuff
\* configuration (f<N/3, so N=4 ⇒ f≤1). MaxView=3 and MaxHeight=3 are
\* the smallest bounds that exercise a pipelined two-chain commit
\* (need 3 consecutive views to commit the first block). MaxBlocks=4
\* caps block proposals including genesis — enough to demonstrate
\* commits and safety, bounded for TLC.

SPECIFICATION Spec

CONSTANTS
    Replicas = {r0, r1, r2, r3}
    Byzantine = {r3}
    MaxView = 2
    MaxHeight = 2
    MaxBlocks = 3

INVARIANTS
    TypeInvariant
    NoDoubleVoteInView
    AgreementAtHeight
    CommittedChainConsistent
    QCRequiresQuorum
    CommitRequiresQC
    ByzantineBound

PROPERTIES
    CommittedMonotonic
    QCsMonotonic
    VotesMonotonic
    BlocksMonotonic

CHECK_DEADLOCK FALSE
