\* TLC stress-bound configuration for HotStuff.tla — exercises the
\* locked-QC vote constraint at bounds high enough to reach the
\* "two conflicting blocks at the same height" scenario.
\*
\* MaxView=4 admits a view-3 conflicting block at height 1 plus a
\* view-4 child whose QC would trigger Commit on the conflicting
\* parent. If the spec's vote rule were under-constrained (as it was
\* in the original session-1 draft before FormQC was coupled with
\* atomic lock update), TLC would find the safety violation here.
\*
\* With the tightened spec (atomic lock on FormQC), honest replicas
\* refuse to vote for the conflicting block in view 3 because their
\* locked QC has already advanced past genesis. The conflicting block
\* cannot accumulate 2f+1 votes, so no QC forms on it, and the
\* commit path is unreachable.
\*
\* State space at these bounds is ~30M states on an 8-worker TLC run;
\* intended for pre-release / nightly CI, not every commit.

SPECIFICATION Spec

CONSTANTS
    Replicas = {r0, r1, r2, r3}
    Byzantine = {r3}
    MaxView = 4
    MaxHeight = 2
    MaxBlocks = 5

INVARIANTS
    TypeInvariant
    NoDoubleVoteInView
    AgreementAtHeight
    CommittedChainConsistent
    QCRequiresQuorum
    CommitRequiresQC
    ByzantineBound

PROPERTIES
    CommittedMonotonic
    QCsMonotonic
    VotesMonotonic
    BlocksMonotonic

CHECK_DEADLOCK FALSE
