\* TLC stress-bound configuration for HotStuff.tla — exercises the
\* locked-QC vote constraint at bounds high enough to reach the
\* "two conflicting blocks at the same height" scenario, plus the
\* session-2 view-change flow under Byzantine timeout / stale-NewView
\* attacks.
\*
\* MaxView=3 admits sequences like: view 1 times out (2f+1 NewViews) →
\* ViewChange(2) → propose in view 2 → QC in view 2 → propose in view 3
\* → QC in view 3 → two-chain commit of view-2 block. Combined with
\* Byzantine TriggerTimeout variants (stale highQCblock), this stresses
\* both the locked-QC vote rule and the view-change path.
\*
\* State space at these bounds fits in memory on an 8-worker TLC run;
\* intended for pre-release / nightly CI, not every commit.
\*
\* With the tightened spec (atomic lock on FormQC; v=view guard), the
\* regression harness still passes — no honest replica ever commits
\* two blocks at the same height.

SPECIFICATION Spec

CONSTANTS
    Replicas = {r0, r1, r2, r3}
    Byzantine = {r3}
    MaxView = 3
    MaxHeight = 2
    MaxBlocks = 3

INVARIANTS
    TypeInvariant
    NoDoubleVoteInView
    AgreementAtHeight
    CommittedChainConsistent
    QCRequiresQuorum
    CommitRequiresQC
    ByzantineBound
    NewViewQCIsReal

PROPERTIES
    ViewMonotonic
    CommittedMonotonic
    QCsMonotonic
    VotesMonotonic
    BlocksMonotonic
    NewViewsMonotonic

CHECK_DEADLOCK FALSE
