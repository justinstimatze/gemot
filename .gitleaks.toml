title = "gemot gitleaks configuration"

# Start from gitleaks' built-in rule set, then add gemot-specific allowlists.
[extend]
useDefault = true

# Public, view-only gemot share-token links embedded in the static demo page.
# A share token grants read-only access to one deliberation group and is meant
# to be shared (the create_share / lookup_share feature) — it is not a
# credential, signing key, or payment secret. Allowlist the demo-link SHAPE
# (not a blanket hex match) so an intentional public link doesn't perpetually
# fail CI, while any real secret still trips the scan.
[allowlist]
description = "gemot public demo share-token links (view-only, intentional)"
regexTarget = "line"
regexes = [
  '''vis\.gemot\.dev/g/[a-z0-9._-]+\?token=[0-9a-f]{16,}''',
]
