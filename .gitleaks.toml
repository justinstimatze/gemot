title = "gemot gitleaks configuration"

# Start from gitleaks' built-in rule set, then add a tightly-scoped allowlist.
[extend]
useDefault = true

# Allowlist EXACTLY ONE known value: a view-only gemot share token that appears
# in a public demo link in the static landing page (internal/mcp/static/
# index.html, git history). A share token grants read-only access to one
# deliberation group and is meant to be shared (create_share / lookup_share) —
# it is not a credential, signing key, or payment secret, and it is already
# public. This matches the exact secret value (default regexTarget = "secret"),
# NOT a line/URL shape, so it cannot be used to hide any other secret: every
# real secret still trips the scan.
[allowlist]
description = "gemot public demo share token (view-only, already public, not a credential)"
regexes = [
  "9ca82cd59da10790bbff6ebc33757db3",
]
