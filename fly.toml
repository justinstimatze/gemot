app = "gemot"
primary_region = "sjc"

[build]

[env]
  GEMOT_DB = "/data/gemot.db"

[mounts]
  source = "gemot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[deploy]
  strategy = "rolling"

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    path = "/health"
